apiVersion: v1
kind: ConfigMap
metadata:
  name: credpay-config
  namespace: credpay
  labels:
    app.kubernetes.io/part-of: credpay
data:
  DB_HOST: "psql-credpay.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "credpay"
  DB_USERNAME: "credpayadmin"
  spring.datasource.url: "jdbc:postgresql://psql-credpay.postgres.database.azure.com:5432/credpay?sslmode=require"
  spring.datasource.username: "credpayadmin"
  java_tool_options: "-XX:MaxRAMPercentage=75"