apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema-init
  namespace: credpay
  labels:
    app.kubernetes.io/part-of: credpay
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-schema-init
        app.kubernetes.io/part-of: credpay
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Applying schema to $DB_HOST/DB_NAME....."
              psql "host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USERNAME sslmode=require" \
              -v ON_ERROR_STOP=1 -f /schema/schema.sql
              echo "Schema applied."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credpay-db
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: credpay-config
          volumeMounts:
            - name: schema
              mountPath: /schema
              ReadOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
      volumes:
        - name: schema
          configMap:
            name: db-schema
