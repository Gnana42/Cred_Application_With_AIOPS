#trigger:
#- main

pool:
  vmImage: ubuntu-latest

variables:
  # Azure service connections
  acrServiceConnection: 'ACR-SC'
  azureServiceConnection: 'Jarvis-Manual'

  # ACR resource name (not the service connection name above)
  # `az aks update --attach-acr`, which takes the registry's own name.
  acrName: 'credpaycr'

  # Image tag - every build is pushed as both $(tag) and :latest
  tag: '$(Build.BuildId)'

  # Repositories in ACR
  frontendRepository: 'credpay/frontend'
  userRepository: 'credpay/user-service'
  paymentRepository: 'credpay/payment-service'

  # Terraform remote state backend
  tfStateRg: 'Capstone-RG'
  tfStateStorage: 'credbackendstorage'
  tfStateContainer: 'statefile'
  tfStateKey: 'credpay.terraform.tfstate'

  # AKS cluster - deterministic names from terraform/main.tf's
  # name_prefix = "credpay" (rg-credpay / aks-credpay)
  aksResourceGroup: 'credpay-rg'
  aksClusterName: 'aks-credpay'
  k8sNamespace: 'credpay'

  # Azure Key Vault - created out-of-band (like the ACR), in the CredProj
  # bootstrap RG (same RG as the Terraform state storage account, not
  # rg-credpay). Terraform writes the Postgres secrets into it; the
  # pipeline reads them back below.
  keyVaultName: 'credpay-keyvault'
  keyVaultResourceGroup: 'Capstone-RG'

stages:
  # =========================================================
  # STAGE 1 - TERRAFORM
  # Provisions/updates AKS, PostgreSQL, networking, Log Analytics, and
  # pushes the PostgreSQL credentials into the existing Azure Key Vault.
  # =========================================================

  - stage: Terraform
    displayName: Terraform Infrastructure
    jobs:
      - job: TerraformApply
        displayName: Terraform Init & Apply
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: "Terraform Initialization"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: Terraform
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStateRg)'
              backendAzureRmStorageAccountName: '$(tfStateStorage)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTask@5
            displayName: Terraform Apply (infra + push secrets to Key Vault)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: >-
                -var-file="terraform.tfvars" --auto-approve
                -var="key_vault_name=$(keyVaultName)"
                -var="key_vault_resource_group_name=$(keyVaultResourceGroup)"
              workingDirectory: Terraform
              environmentServiceNameAzureRM: '$(azureServiceConnection)'

          - task: TerraformTask@5
            displayName: Show Terraform Outputs
            inputs:
              provider: 'azurerm'
              command: 'output'
              workingDirectory: Terraform
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
  # =========================================================
  # STAGE 2 - BUILD & PUSH DOCKER IMAGES
  # =========================================================
  - stage: DockerBuild
    displayName: Docker Build & Push
    dependsOn: Terraform
    jobs:
      - job: BuildPushImages
        displayName: Build Docker images and push to ACR
        steps:
          - checkout: self

          #########################################################
          # Display Build Information
          #########################################################

          - script: |
              echo "Repository : $(Build.Repository.Name)"
              echo "Branch     : $(Build.SourceBranch)"
              echo "Build ID   : $(Build.BuildId)"
              echo "Image Tag  : $(tag)"
            displayName: Build Information

          - task: Docker@2
            displayName: Build & Push Frontend Image
            inputs:
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(frontendRepository)'
              command: 'buildAndPush'
              Dockerfile: 'frontend-react/Dockerfile'
              buildContext: 'frontend-react'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: Build & Push User Service Image
            inputs:
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(userRepository)'
              command: 'buildAndPush'
              Dockerfile: 'user-service/Dockerfile'
              buildContext: 'user-service'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: Build & Push Payment Service Image
            inputs:
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(paymentRepository)'
              command: 'buildAndPush'
              Dockerfile: 'payment-service/Dockerfile'
              buildContext: 'payment-service'
              tags: |
                $(tag)
                latest

  # =========================================================
  # STAGE 3 - DEPLOY TO AKS
  # Reads secrets from Key Vault, recreates the K8s Secret, deploys the
  # schema Job, then user-service and payment-service (rolling update),
  # then the frontend (blue/green), runs a smoke test, and only then
  # switches live traffic to the new frontend color.
  # =========================================================

  - stage: DeployToAKS
    displayName: Deploy to AKS
    dependsOn: DockerBuild
    jobs:
      - job: Deploy
        displayName: Deploy Credpay
        steps:
          - checkout: self
          - task: AzureCLI@3
            displayName: Get AKS Credentials
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                az aks get-credentials \
                   --resource-group $(aksResourceGroup) \
                   --name $(aksClusterName) \
                   --admin \
                   --overwrite-existing
                kubectl get nodes

    #########################################################
    # Attach ACR to AKS - grants the kubelet identity AcrPull so pods can
    # pull images with no imagePullSecrets. Idempotent: safe to re-run
    # every deployment, only ever changes anything the very first time.
    #########################################################

          - task: AzureCLI@3
            displayName: Attach ACR to AKS
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                az aks update \
                   --resource-group $(aksResourceGroup) \
                   --name $(aksClusterName) \
                   --attach-acr $(acrName)

    #########################################################
    # Ensure the ingress-nginx controller is installed - required for the
    # Ingress manifest applied later to mean anything.
    #
    # IMPORTANT: check whether the controller already exists (by Service,
    # not by Helm release) before running `helm upgrade --install`. Confirmed
    # live that a controller installed some other way (e.g. plain `kubectl
    # apply` of the static manifests, as this cluster originally was) makes
    # Helm refuse outright: it won't "adopt" a ServiceAccount it didn't
    # create, since that ServiceAccount lacks Helm's own ownership
    # labels/annotations. `helm upgrade --install` is only a safe no-op for
    # something Helm itself installed - not for "the controller exists at
    # all, however it got there". ubuntu-latest Microsoft-hosted agents
    # ship with Helm preinstalled - no HelmInstaller task needed.
    #########################################################

          - task: AzureCLI@3
            displayName: Ensure Ingress Controller Installed
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                if kubectl get svc ingress-nginx-controller -n ingress-nginx >/dev/null 2>&1; then
                  echo "ingress-nginx controller already present - skipping Helm install."
                else
                  echo "ingress-nginx controller not found - installing via Helm..."
                  helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                  helm repo update
                  helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
                     --namespace ingress-nginx --create-namespace \
                     --wait --timeout 5m
                fi
                
                echo "Waiting for the ingress-nginx controller's public IP..."
                for i in $(seq 1 30); do
                  IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                  if [ -n "$IP" ]; then
                    echo "Ingress controller IP: $IP"
                    break
                  fi
                  echo "Still waiting... ($i/30)"
                  sleep 10
                done
                kubectl get svc -n ingress-nginx ingress-nginx-controller

              #########################################################
              # Read the PostgreSQL secrets Terraform pushed into Key Vault.
              # Maps each secret into a (masked) pipeline variable of the same
              # name - referenced below via env: mappings, never $(...) macros,
              # because Azure DevOps does not expand secret variables inline.
              #########################################################

          - task: AzureKeyVault@2
            displayName: Read Secrets from Azure Key Vault
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: 'credpay-keyvault'
              SecretsFilter: 'postgres-host,postgres-database-name,postgres-username,postgres-password'
              RunAsPreJob: false

          #########################################################
          # Namespace + ConfigMap - safe to re-apply every run
          #########################################################    

          - task: AzureCLI@3
            displayName: Apply Namespace and ConfigMap
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl apply -f k8s/namespace/namespace.yml
                kubectl apply -f k8s/Configmaps/configmap.yml

          #########################################################
          # Kubernetes Secret - recreated from Key Vault on every deployment.
          # `--dry-run=client -o yaml | kubectl apply -f -` makes this
          # create-or-update, so it is safe to run on every pipeline run.
          #########################################################
          - task: AzureCLI@3
            displayName: Create or Update Kubernetes Secret
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl create secret generic credpay-db \
                   --namespace $(k8sNamespace) \
                   --from-literal=DB_PASSWORD="$DB_PASSWORD" \
                   --from-literal=SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
                   --dry-run=client -o yaml | kubectl apply -f -
            env:
              DB_PASSWORD: $(postgres-password)

          #########################################################
          # Database Schema Job - Jobs are immutable, so delete any previous
          # run before re-applying. schema.sql is non-destructive (CREATE TABLE
          # IF NOT EXISTS + seed rows only inserted into an empty table), so
          # running it again on every deploy never touches real data created
          # through the live app - only ever matters on a genuinely fresh DB.
          #########################################################
          - task: AzureCLI@3
            displayName: Run Database Schema Job
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl create configmap db-schema \
                   --namespace $(k8sNamespace) \
                   --from-file=schema.sql=schema.sql \
                   --dry-run=client -o yaml | kubectl apply -f -
                
                kubectl delete job db-schema-init -n $(k8sNamespace) --ignore-not-found
                
                kubectl apply -f k8s/Postgres/schema-init-job.yml
                kubectl wait --for=condition=complete job/db-schema-init -n $(k8sNamespace) --timeout=120s
                kubectl logs job/db-schema-init -n $(k8sNamespace)

          #########################################################
          # User Service - Rolling Update (unchanged strategy)
          #########################################################
          - task: AzureCLI@3
            displayName: Deploy User Service
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl apply -f k8s/user-service/
                kubectl rollout restart deployment/user-service -n $(k8s.Namespace)
                kubectl rollout status deployment/user-service -n $(k8s.Namespace) --timeout=180s
                kubectl get pods -n $(k8s.Namespace) -l app.kubernetes.io/name=user-service

          #########################################################
          # Payment Service - Rolling Update (unchanged strategy)
          #########################################################
          - task: AzureCLI@3
            displayName: Deploy Payment Service
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl apply -f k8s/payment-service/
                kubectl rollout restart deployment/payment-service -n $(k8s.Namespace)
                kubectl rollout status deployment/payment-service -n $(k8s.Namespace) --timeout=180s
                kubectl get pods -n $(k8s.Namespace) -l app.kubernetes.io/name=payment-service

          #########################################################
          # Frontend - Blue/Green
          # Detect which color is currently live (the frontend Service's
          # `version` selector), then roll the freshly-pushed :latest image
          # out to the OTHER color only. The live color is left untouched.
          #
          # IMPORTANT: `kubectl apply -f service.yaml` was confirmed (live, on
          # this cluster) to reset spec.selector.version back to the file's
          # hardcoded "blue" default on every run, even though the file itself
          # never changed - silently defeating the whole rotation (every run
          # would see "blue" and redeploy to "green" again). Fix: only ever
          # apply the static service.yaml once, to bootstrap the Service on a
          # brand new cluster. Once it exists, its selector is owned exclusively
          # by the "Switch Traffic" step's `kubectl patch`, below - never by
          # `apply` again.
          #########################################################
          - task: AzureCLI@3
            displayName: Deploy Frontend (Blue/Green - new version)
            name: DeployFrontend
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                
                if ! kubectl get svc frontend -n $(k8sNamespace) >/dev/null 2>&1; then
                  echo "frontend Service doesn't exist yet - bootstrapping it (default color: blue)"
                  kubectl apply -f k8s/frontend/service.yaml
                fi
                
                kubectl apply -f k8s/frontend/deployment-blue.yaml
                kubectl apply -f k8s/frontend/deployment-green.yaml
                kubectl apply -f k8s/frontend/hpa-blue.yaml
                kubectl apply -f k8s/frontend/hpa-green.yaml
                
                CURRENT_COLOR=$(kubectl get svc frontend -n $(k8sNamespace) -o jsonpath='{.spec.selector.version}')
                if [ "$CURRENT_COLOR" = "blue" ]; then
                  NEW_COLOR="green"
                else
                  NEW_COLOR="blue"
                fi
                
                echo "Current active color : $CURRENT_COLOR"
                echo "Deploying new version to : $NEW_COLOR"
                
                kubectl rollout restart deployment/frontend-$NEW_COLOR -n $(k8sNamespace)
                kubectl rollout status deployment/frontend-$NEW_COLOR -n $(k8sNamespace) --timeout=180s
                kubectl get pods -n $(k8sNamespace) -l app.kubernetes.io/name=frontend,version=$NEW_COLOR
                
                echo "##vso[task.setvariable variable=NEW_COLOR;isOutput=true]$NEW_COLOR"

          #########################################################
          # Smoke Test - hits the NEW color directly (bypassing the live
          # Service) so a broken build is caught BEFORE it receives traffic.
          # Runs from inside a pod of the new color so it can reach the
          # backend Services over the cluster network without needing the
          # public Ingress IP.
          #########################################################
          - task: AzureCLI@3
            displayName: Smoke Test New Frontend Version
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                NEW_COLOR=$(DeployFrontend.NEW_COLOR)
                NEW_POD=$(kubectl get pods -n $(k8sNamespace) -l app.kubernetes.io/name=frontend,version=$NEW_COLOR -o jsonpath='{.items[0].metadata.name}')
                echo "Smoke testing pod: $NEW_POD (version=$NEW_COLOR)"
                
                # wget's own exit code is 0 only on HTTP 2xx - no output-parsing needed.
                check () {
                 echo "GET $2"
                 if kubectl exec -n $(k8sNamespace) "$NEW_POD" -- wget -q -O /dev/null "$1"; then
                  echo "OK: $2"
                 else
                  echo "FAILED: $2"
                  exit 1
                 fi
                }
                
                    # 127.0.0.1, not "localhost": the pod's /etc/hosts maps localhost
                    # to ::1 first, but nginx only listens on 0.0.0.0:80 (IPv4) - wget
                    # doesn't fall back address families, so "localhost" gets a false
                    # "Connection refused" even though the app is healthy.
                check "http://127.0.0.1:80/" "/ (frontend)"
                check "http://user-service.$(k8sNamespace).svc.cluster.local:8080/api/users/health" "/api/users/health (user-service)"
                check "http://payment-service.$(k8sNamespace).svc.cluster.local:8000/api/payment/health" "/api/payment/health (payment-service)"
                
                echo "Smoke test passed for $NEW_COLOR."

          #########################################################
          # Switch Traffic - only reached if the smoke test above succeeded
          # (a failed step stops the job by default, so no explicit
          # condition is needed here - the previous color simply stays live).
          #########################################################
          - task: AzureCLI@3
            displayName: Switch Traffic to New Frontend Version
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                NEW_COLOR=$(DeployFrontend.NEW_COLOR)
                kubectl patch service frontend -n $(k8sNamespace) \
                   --type merge \
                   -p "{\"spec\":{\"selector\":{\"app.kubernetes.io/name\":\"frontend\",\"version\":\"$NEW_COLOR\"}}}"
                echo "Traffic switched to $NEW_COLOR"

          #########################################################
          # Ingress - single entry point, unchanged
          #########################################################
          - task: AzureCLI@3
            displayName: Apply Ingress
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                kubectl apply -f k8s/ingress/ingress.yml

          #########################################################
          # Final Validation - always runs (even after a failed smoke test)
          # so the pipeline log always shows the true state of the cluster.
          #########################################################
          - task: AzureCLI@3
            displayName: Final Validation
            condition: always()
            inputs:
              connectionType: 'azureRM'
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "===== Pods ====="
                kubectl get pods -n $(k8sNamespace) -o wide
                
                echo "===== Services ====="
                kubectl get svc -n $(k8sNamespace)
                
                echo "===== Ingress ====="
                kubectl get ingress -n $(k8sNamespace)
                
                echo "===== Deployments ====="
                kubectl get deployments -n $(k8sNamespace)
                
                echo "===== HPA ====="
                kubectl get hpa -n $(k8sNamespace)
                
                echo "===== Active Frontend Version (Service selector) ====="
                kubectl get svc frontend -n $(k8sNamespace) -o jsonpath='{.spec.selector}'
                echo
                
                echo "===== Current Images ====="
                kubectl get deployments -n $(k8sNamespace) \
                   -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}'
                
                INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                if [ -n "$INGRESS_IP" ]; then
                  echo "===== End-to-end check via Ingress ($INGRESS_IP) ====="
                  curl -s -o /dev/null -w "GET /                    -> HTTP %{http_code}\n" http://$INGRESS_IP/ || true
                  curl -s -o /dev/null -w "GET /api/users/health    -> HTTP %{http_code}\n" http://$INGRESS_IP/api/users/health || true
                  curl -s -o /dev/null -w "GET /api/payment/health  -> HTTP %{http_code}\n" http://$INGRESS_IP/api/payment/health || true
                else
                  echo "Ingress controller has no public IP yet - skipping external check."
                fi
                
                ACTIVE_COLOR=$(kubectl get svc frontend -n $(k8sNamespace) -o jsonpath='{.spec.selector.version}')
                ACTIVE_COLOR_UPPER=$(echo $ACTIVE_COLOR | tr '[:lower:]' '[:upper:]')
                echo ""
                echo "=================================================="
                echo " PROD ENVIRONMENT IS CURRENTLY RUNNING ON: $ACTIVE_COLOR_UPPER"
                if [ -n "$INGRESS_IP" ]; then
                  echo " BROWSE TO THE APP AT: http://$INGRESS_IP/"
                else
                  echo " Ingress controller has no public IP yet - re-run this stage or"
                  echo " check with: kubectl get svc -n ingress-nginx ingress-nginx-controller"
                fi
                echo "=================================================="
